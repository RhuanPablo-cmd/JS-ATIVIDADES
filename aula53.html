<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="aula53.css">
</head>

<body>
    <div id="caixa" class="caixa">
        <div class="valor">
            <label>Valor 1</label>
            <input type="text" placeholder="0" id="valor1" name="valor1">
        </div>
        <div class="valor">
            <label>Valor 2</label>
            <input type="text" placeholder="0" id="valor2" name="valor2">
        </div>
        <div class="valor">
            <label>Resultado</label>
            <input type="text" placeholder="-" id="res" name="res" style="cursor: not-allowed;" readonly>
        </div>
        <div class="operacoes">
            <button id="somar">+</button>
            <button id="subtrair">-</button>
            <button id="multiplicar">X</button>
            <button id="dividir">/</button>
        </div>
    </div>

    <script src="aula53.js"></script>
</body>

</html>
