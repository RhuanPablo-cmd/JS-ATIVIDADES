<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="aula70.css">
</head>

<body>

    <div class="calc" id="calc">
        <div class="div_nome" id="div_nome">Calculadora</div>

        <div class="div_display" id="div_display">
            <p id="display" class="display">0</p>
        </div>

        <div class="div_teclas" id="div_teclas"></div>
        <button id="t_ligar" class="tecla">ON</button>
        <button id="tlimpar" class="tecla">CL</button>
        <button id="t(" class="tecla num">(</button>
        <button id="t)" class="tecla num">)</button>
        <button id="t7" class="tecla num">7</button>
        <button id="t8" class="tecla num">8</button>
        <button id="t9" class="tecla num">9</button>
        <button id="t_mais" class="tecla op">+</button>
        <button id="t4" class="tecla num">4</button>
        <button id="t5" class="tecla num">5</button>
        <button id="t6" class="tecla num">6</button>
        <button id="t_menos" class="tecla op">-</button>
        <button id="t1" class="tecla num">1</button>
        <button id="t2" class="tecla num">2</button>
        <button id="t3" class="tecla num">3</button>
        <button id="t_vezes" class="tecla op">*</button>
        <button id="t0" class="tecla num">0</button>
        <button id="t_" class="tecla op">,</button>
        <button id="t_igual" class="tecla res">=</button>
        <button id="t_div" class="tecla op">/</button>
    </div>

    <script src="aula70.js"></script>
</body>

</html>
