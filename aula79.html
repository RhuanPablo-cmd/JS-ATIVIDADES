
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio e Alarme</title>
    <link rel="stylesheet" href="aula79.css">
</head>
<body>
    <div id="timer" class="timer">
        <div id="data_div" class="div_data"></div>
        <div id="data_relo" class="div_relogio">00:00:00</div>

        <div id="def_alarme" class="def_alarme">
            <label id="hora_alarme" for="tmp_alarme">Hora do Alarme:</label><br>
            <label for="tmp_alarme">Tempo do alarme (segundos)</label>
            <input type="number" id="tmp_alarme" value="0" min="0">
        </div>

        <div id="comandos" class="comandos">
            <button id="btn_ativar" type="button">Ativar</button>
            <button id="btn_parar" type="button">Parar</button>
        </div>
    </div>
    <script src="aula79.js"></script>
</body>
</html>
