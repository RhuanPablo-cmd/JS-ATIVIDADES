<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Cursos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 100vh;
        }

        button {
            width: 150px;
            height: 40px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .curso {
            display: flex;
            justify-content: center;
            width: 200px;
            border: 4px solid #888;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            transition: 0.3s;
        }

        .curso:hover {
            border-color: red;
        }

        .c1 {
            background-color: #ccc;
            color: #444;
        }

        .c2 {
            background-color: #444;
            color: #ccc;
        }

        .selecionado {
            background-color: yellow;
            border-color: black;
            color: black;
        }

        .caixa {
            display: flex;  
            align-items: center;
            justify-content: space-around;
            flex-direction: column;
            background-color: #eee;
            width: 300px;
            min-height: 350px;
            border: 4px solid #000;
            border-radius: 10px;
            padding: 10px;
        }
        .btnlixeira{
            display: flex;
            align-items: center;
            justify-content: center;    
            margin-top: 10px;
            width: 30px;
            height: 30px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>

   <script src="aula42.js"></script>

</body>

</html>
